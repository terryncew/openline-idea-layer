<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IL-1-0 Trial: Home Energy Options Worksheet (Fictional Estimate)</title></head><body><main><h1>Home Energy Options Worksheet (Fictional Estimate)</h1><p id="banner"></p><label>Mock Tariff ($/kWh) <input id="tariff" type="number" step="0.01" value="0.34"></label><pre id="out"></pre><script type="module">import {compareEnergyOptions,exportComparisonMarkdown} from './logic.mjs';const render=()=>{const r=compareEnergyOptions({mockTariffPerKwh:Number(document.getElementById('tariff').value)});document.getElementById('banner').textContent=r.banner;document.getElementById('out').textContent=exportComparisonMarkdown(r);};document.getElementById('tariff').addEventListener('input',render);render();</script></main></body></html>
